# 자율 주행 모드 켜기 조건과 실행 중 안전 감시 기준
engage:                       # 최고 모델 점수표(results/best_scorecard.json)가 이 기준을 모두 넘어야 자율 모드를 켬
  min_completion: 0.95        # 관련 시나리오마다 완주율
  max_crashes: 0              # 이탈·충돌
  max_violations: 0           # 신호 위반 + 우회전 일시정지 위반 + 시골길 위험 행동
  max_school_speeding_s: 1.0  # 어린이보호구역 과속 시간 합
monitor:                      # 실행 중 이 중 하나라도 걸리면 '인간 개입 요청' + 기준 제어기로 넘김
  ttc_s: 2.0                  # 충돌 예상 시간
  value_drop: 4.0             # 0.5초 사이 가치(value) 추정이 이만큼 떨어지면 '자신 없음'
  disagreement: 0.6           # 모델 행동과 기준 제어기 행동 차이(조향·가속 합)가 이만큼 크면 '자신 없음'
  ood_z: 6.0                  # 학습 때 관측 분포에서 이만큼(표준편차 배수) 벗어나면 '처음 보는 상황'
  over_limit_kmh: 5.0         # 제한속도 + 이 값 넘으면 규칙 위반 위험
  min_edge_clearance_m: 0.15  # 길 가장자리 여유
  hold_s: 3.0                 # 넘겨받은 뒤 최소 이만큼은 기준 제어기로 달림
  safe_stop_ttc_s: 1.0        # 이보다 급하면 바로 비상 정지
  # 시골길 차량 흐름 (농기계 대신 일반 차량)
  oncoming_check_m: 40        # 좁은 길에서 마주 오는 차가 이 거리 안인데
  meet_margin_kmh: 5          #   엇갈림 속도(15 km/h) + 이 값보다 빠르면 '엇갈림 위험'
  entering_check_m: 30        # 옆길에서 들어오는 차가 이 거리 안에서 아직 들어오는 중이면 알림
  # 앞지르기는 허용 구간(중앙선 점선·직선·보호구역 아님) + 시야 100 m + 마주 오는 차 없음일 때만. 아니면 '위험한 앞지르기'
